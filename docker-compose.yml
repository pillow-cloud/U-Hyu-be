version: '3'

services:
  uhyu-backend:
    image: localhost:5000/u-hyu-be:latest
    container_name: uhyu-backend
    ports:
      - "8080:8080"
    env_file:
      - /home/pillow/srv/U-Hyu-be/.env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - FASTAPI_RECOMMEND_HOST=http://uhyu-recommender:8000
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - uhyu-net
      - monitoring

networks:
  uhyu-net:
    external: true
  monitoring:
    external: true
