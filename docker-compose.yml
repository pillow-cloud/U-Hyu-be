version: '3'

services:
  uhyu-backend:
    image: localhost:5000/u-hyu-be:latest   # CI에서 쓰는 registry_url이랑 동일하게
    container_name: uhyu-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      FASTAPI_RECOMMEND_HOST: http://uhyu-recommender:8000
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - uhyu-net

networks:
  uhyu-net:
    external: true