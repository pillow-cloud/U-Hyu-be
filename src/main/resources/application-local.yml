spring:
  config:
    activate:
      on-profile: local

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-name: Kakao
            # 로컬 개발은 무조건 localhost:8080 사용
            redirect-uri: "http://localhost:8080/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-time: ${ACCESS_TOKEN_EXP}
  refresh-token-expiration-days: ${REFRESH_TOKEN_EXP}
  cookie:
    domain: localhost
    secure: false
    same-site: Lax

cloud:
  aws:
    s3:
      # 로컬 개발용 .env에서 MINIO_ENDPOINT=http://localhost:9000 설정 필요
      endpoint: ${MINIO_ENDPOINT}
      bucket: ${S3_BUCKET_NAME}
      public-endpoint: ${MINIO_ENDPOINT}/${S3_BUCKET_NAME} # 퍼블릭 접근도 로컬 기준

fastapi:
   # 로컬 개발용 .env에서 FASTAPI_RECOMMEND_HOST=http://localhost:8000 설정 필요
  url: ${FASTAPI_RECOMMEND_HOST}

logging:
  level:
    com.ureca.uhyu: debug
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql.BasicBinder: trace
