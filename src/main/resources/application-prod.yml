spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-name: Kakao
            redirect-uri: "https://uhyu-api.pillow12360.world/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-time: ${ACCESS_TOKEN_EXP}
  refresh-token-expiration-days: ${REFRESH_TOKEN_EXP}
  cookie:
    domain: pillow12360.world
    secure: true
    same-site: None

cloud:
  aws:
    s3:
      endpoint: ${MINIO_ENDPOINT}
      bucket: ${S3_BUCKET_NAME}
      public-endpoint: https://minio.pillow12360.world

fastapi:
  url: ${FASTAPI_RECOMMEND_HOST}

logging:
  level:
    com.ureca.uhyu: info
    org.hibernate.SQL: off

server:
  tomcat:
    use-relative-redirects: true
