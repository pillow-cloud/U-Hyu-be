spring:
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_REST_API_KEY}
            client-name: Kakao
            redirect-uri: "https://uhyu-api.pillow12360.world/login/oauth2/code/{registrationId}"
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    show-sql: false # 운영에서는 SQL 로그 비활성화 추천

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.yaml

jwt:
  secret: ${JWT_SECRET_KEY}
  access-token-expiration-time: ${ACCESS_TOKEN_EXP}
  refresh-token-expiration-days: ${REFRESH_TOKEN_EXP}
  cookie:
    domain: pillow12360.world
    secure: true
    same-site: Lax

logging:
  level:
    com.ureca.uhyu.domain.auth.jwt: debug
    com.ureca.uhyu.domain.auth.filter: debug
    com.ureca.uhyu.domain.auth.handler: debug
    org.hibernate.SQL: off
    org.hibernate.type.descriptor.sql.BasicBinder: off

server:
  tomcat:
    use-relative-redirects: true

fastapi:
  url: ${FASTAPI_RECOMMEND_HOST}

app:
  frontend:
    url:
      prod: https://uhyu.pillow12360.world

cloud:
  aws:
    credentials:
      access-key: ${MINIO_ACCESS_KEY:pillow12360}
      secret-key: ${MINIO_SECRET_KEY:ehdcks201352}
    region:
      static: us-east-1
    s3:
      bucket: uhyu-bucket
      endpoint: ${MINIO_ENDPOINT:http://homecloud-minio:9000}
